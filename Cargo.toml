[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Your Name <YourName@yourdomain.com>"]
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
documentation = "https://docs.rs/"
repository = "https://github.com/TODO"
homepage = "https://github.com/TODO"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.18"
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI dependencies
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
miette = { version = "7", features = ["fancy"] }
dirs = "6"
libc = "0.2"
toml = "0.8"
tempfile = "3"
is-terminal = "0.4"

# CLI testing
assert_cmd = "2"
trycmd = "0.15"
predicates = "3"

# Uncomment when needed for your CLI tool:
# reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# indicatif = "0.17"
# console = "0.15"
# secrecy = "0.10"
# dotenvy = "0.15"
# self_update = "0.42"
# owo-colors = "4"

# workspace crates
{{ project-name }}-core = { path = "crates/core" }
{{ project-name }}-cli = { path = "apps/cli" }

[workspace.dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
pedantic = "warn"
